name: Update Watch Grid JSON

# Runs build-watch.py on a schedule and on demand, then commits any change
# to watch-videos.json so the Watch page picks it up.
#
# Schedule: EVERY 6 HOURS at :10 (00:10, 06:10, 12:10, 18:10 UTC; GitHub
# often starts scheduled runs late). Changed 2026-10-15 from daily 12:10 UTC:
# YouTube's feed has outages of a few hours most days, so one daily attempt
# could miss a new Sunday message for days. A run that meets an outage keeps
# the published grid and stays green unless the site is more than 8 days
# behind (scripts/sermon_feed.py, feed_down_exit_code).
# Message starts come from the YouTube chapters that the Cowork 'Weekly
# YouTube chapters' task writes Mondays 4:30 AM Central (changed 2026-09-24).
# A run before the chapters exist publishes the new card with start 0; the
# first run after they are written fills it in, because a description chapter
# always wins. Frequent runs also pick up chapters added to older videos.
#
# FULL SUNDAY MESSAGES ONLY: YouTube Shorts are never listed (2026-10-15).
# The rule lives in scripts/sermon_feed.py and the tests below must pass
# before anything is built.
#
# The build also resolves each video's message start time (so the on-site
# player can skip worship) by reading the video's auto-captions with yt-dlp.
# See the header of scripts/build-watch.py for how that is decided. Videos
# whose captions are not ready yet are retried automatically on the next run,
# which is why yt-dlp is installed here.
#
# Manual trigger: Actions tab > "Update Watch Grid JSON" > "Run workflow".

on:
  schedule:
    - cron: '10 */6 * * *'  # every 6 hours at :10
  workflow_dispatch: {}

# One writer at a time: this and "Update Sermon JSON" both push to main.
concurrency:
  group: cu-sermon-data-feeds
  cancel-in-progress: false

permissions:
  contents: write   # required to commit the updated JSON back to the repo

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install yt-dlp (used to read captions for message detection)
        run: python -m pip install --upgrade --quiet yt-dlp

      - name: Test the full-messages-only rule (no Shorts, 2026-10-15)
        run: python -m unittest discover -s scripts -p "test_*.py"

      - name: Build watch JSON
        env:
          CU_WATCH_OUTPUT: ${{ github.workspace }}/watch-videos.json
        run: python scripts/build-watch.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- watch-videos.json; then
            echo "No changes to watch-videos.json. Nothing to commit."
            exit 0
          fi
          git config user.name  "cu-sermon-bot"
          git config user.email "cu-sermon-bot@users.noreply.github.com"
          git add watch-videos.json
          git commit -m "Auto-update watch grid JSON ($(date -u +%Y-%m-%d))"
          git pull --rebase --quiet origin main
          git push
