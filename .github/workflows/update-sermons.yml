name: Update Sermon JSON

# Runs the build-sermons.py script on a schedule and on demand,
# then commits any change to latest-sermon.json so the website picks it up.
#
# Schedule: EVERY 6 HOURS (00:00, 06:00, 12:00, 18:00 UTC; GitHub often
# starts scheduled runs late). Sunday's sermon uploads to YouTube around
# 11:40pm-12:05am Central, so the first run after that picks it up.
# Changed 2026-10-15 from Monday 07:00 UTC only: YouTube's feed has outages of
# a few hours most days, and a single weekly attempt could leave last week's
# message up all week. A run with nothing new commits nothing, and a run that
# meets an outage keeps the published list and stays green unless the site is
# more than 8 days behind (scripts/sermon_feed.py, feed_down_exit_code).
#
# FULL SUNDAY MESSAGES ONLY: YouTube Shorts are never listed (2026-10-15).
# The rule lives in scripts/sermon_feed.py and the tests below must pass
# before anything is built.
#
# Manual trigger: Actions tab > "Update Sermon JSON" > "Run workflow".

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch: {}

# One writer at a time: this and "Update Watch Grid JSON" both push to main.
concurrency:
  group: cu-sermon-data-feeds
  cancel-in-progress: false

permissions:
  contents: write   # required to commit the updated JSON back to the repo

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test the full-messages-only rule
        run: python -m unittest discover -s scripts -p "test_*.py"

      - name: Build sermon JSON
        env:
          CU_SERMON_OUTPUT: ${{ github.workspace }}/latest-sermon.json
        run: python scripts/build-sermons.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- latest-sermon.json; then
            echo "No changes to latest-sermon.json. Nothing to commit."
            exit 0
          fi
          git config user.name  "cu-sermon-bot"
          git config user.email "cu-sermon-bot@users.noreply.github.com"
          git add latest-sermon.json
          git commit -m "Auto-update sermon JSON ($(date -u +%Y-%m-%d))"
          git pull --rebase --quiet origin main
          git push
